    pixels.data[i + 1] = base[1] + tone;
    pixels.data[i + 2] = base[2] + tone;

   playFoley(t, .045, 2300, 630, .12);
   return;
  case 'purchase':
   playFoley(t, .065, 4200, 1200, .28);
   playFoley(t + .05, .035, 3600, 1100, .19);
   break;
 }
 const tones = {
  good:[520,880,.07,'sine',.19],bad:[330,130,.08,'triangle',.25],
  shield:[450,1040,.07,'sine',.26],peek:[750,1230,.045,'sine',.23],
  swap:[400,680,.06,'triangle',.2],push:[260,530,.06,'sawtooth',.17],
  cashout:[620,930,.07,'sine',.24],line:[580,960,.08,'sine',.3],
  joker:[210,95,.09,'sawtooth',.36],purchase:[710,1030,.022,'triangle',.11]
 };
 const p = tones[kind];
 if (!p) return;
 const oscillator = audioContext.createOscillator(), level = audioContext.createGain();
 oscillator.type = p[3];
 oscillator.frequency.setValueAtTime(p[0], t);
 oscillator.frequency.exponentialRampToValueAtTime(p[1], t + p[4]);
 level.gain.setValueAtTime(.0001, t);
 level.gain.linearRampToValueAtTime(p[2], t + .012);
 level.gain.exponentialRampToValueAtTime(.0001, t + p[4]);
 oscillator.connect(level).connect(audioBus);
 oscillator.start(t);
 oscillator.stop(t + p[4] + .02);
}
let toastTimeout;
function pop(msg, art) {
 const toast = $('toast');
 toast.textContent = msg;
 if (art) {
  const image = document.createElement('img');
  image.src = art;
  image.alt = '';

 }

 clearTimeout(toastTimeout);
 toastTimeout = setTimeout(() => toast.classList.remove('show'), 1250);
}
function meshCard(c,i,animate=false){
 if(cardMeshes[i])disposeCard(cardMeshes[i]);
 if(!c){cardMeshes[i]=null;return}
 const p=slots[i],face=new THREE.MeshBasicMaterial({map:tex(c),toneMapped:false}),back=new THREE.MeshBasicMaterial({map:backTex,toneMapped:false}),side=mat(0xe5dece,.9);
 const m=new THREE.Mesh(new THREE.BoxGeometry(1.17,.045,1.65),[side,side,face,back,side,side]);m.position.set(animate?deckX:p.x,animate?1.1:.75,animate?deckZ:p.z);m.rotation.x=animate?Math.PI:0;m.castShadow=true;m.userData.index=i;m.userData.targetY=i===G?.selected?1.02:.75;scene.add(m);cardMeshes[i]=m;
 const selection=borderMesh(1.25,1.73,.04,0xffe13b);selection.position.y=.03;selection.visible=i===G?.selected;m.add(selection);m.userData.selection=selection;
 if (animate) sound('deal');
 if (animate && !reduced) animations.push({m,p,start:performance.now(),duration:440});
 else { m.position.set(p.x,m.userData.targetY,p.z); m.rotation.x=0; }
}
function guess(dir){
 if(G.phase!=='playing'||!G.board[G.selected])return;
 const run=G;
 const i=G.selected,old=G.board[i],p=chance(old,dir),c=draw();
 if(!c){finishStage();return}
 G.phase='busy';G.message='Revealing…';refresh();G.turns++;const good=dir==='higher'?c.v>old.v:c.v<old.v;
 const resolve=()=>{
  if(G!==run)return;
  let info='';
  if(good){
   G.board[i]=c;meshCard(c,i,true);G.correct++;G.streak++;G.best=Math.max(G.best,G.streak);
   let pts=Math.max(10,Math.round(100/Math.max(.1,p)));
   if(G.streak>=9)pts*=3;
   if(G.ticket==='risk'&&p<=.4){pts=Math.round(pts*2.5);grantTokens(6);G.riskHits++;if(G.riskHits%3===0)G.shields++}
   else if(has('clover')&&p<=.35)pts*=2;
   const up=G.upgrades[i];if(up==='amp')pts=Math.round(pts*1.5);
   if(old.v>=4&&old.v<=8){pts+=Math.round(100/Math.max(.1,p)*.35);grantTokens(2)}
   if(up==='mint')grantTokens(3);if(up==='kindle')G.streak++;
   if(has('ember'))pts+=20*Math.min(10,G.streak);
   if(has('storm')&&G.streak%3===0)pts+=40*cardsLeft();
   if(G.ticket==='fire'&&G.streak%3===0){pts+=200;G.peeks++}
   if(has('timekeeper')&&G.correct%10===0)G.peeks++;
   if(has('compass')&&G.turns%5===0)G.peeks++;
   if(up==='seed'){G.slotHits[i]++;if(G.slotHits[i]%3===0)refill()}
   if(up==='scout'){G.slotHits[i]++;if(G.slotHits[i]%4===0)G.peeks++}
   grantTokens(2);G.score+=pts;
   if(G.push===1){G.push=2;G.pushScore=pts;info=' · Push 1/2: stay on this position'}
   else if(G.push===2){G.score+=2*(G.pushScore+pts);G.push=0;info=' ·  PUSH COMPLETE 3×'}
   if(G.streak%3===0){G.shields++;refill();if(has('phoenix'))refill();info+=' ·  ON FIRE +1 shield and card';if(G.streak===6){G.peeks++;info+=' · SUPER FIRE +Peek'}}
   else if(G.correct%2===0)refill();
   G.message='✓ '+rank(old)+' → '+rank(c)+' · +'+pts+' pts';sound('good');flash('positive',i);
  }else{
   G.streak=0;if(G.stage===1)G.score=Math.max(0,G.score-75);
   const up=G.upgrades[i],pushing=G.push>0;
   if(!pushing&&has('mirror')&&!G.mirrorUsed){G.mirrorUsed=true;info=' Mirror saved card';sound('shield');flash('ability',i,' MIRROR SAVED')}
   else if(!pushing&&up==='ward'&&!G.wardUsed[i]){G.wardUsed[i]=true;info=' Ward saved card';sound('shield');flash('ability',i,' WARD BLOCK')}
   else if(!pushing&&G.protected[i]){G.protected[i]=false;info='Shield used · card saved';sound('shield');flash('ability',i,' SHIELD BLOCK')}
   else{G.board[i]=null;discardCard(i);info='Position lost';if(G.stage===2&&G.locked.filter(Boolean).length<3){G.locked[i]=true;info+=' ·  Collector locked it'}if(has('salvage')&&!G.salvageUsed){G.salvageUsed=true;refill()}}
   G.push=0;
   const saved=G.board[i]!==null;
   G.message=saved?info:rank(old)+' → '+rank(c)+' · Card lost';
   if(!saved){sound('bad');flash('negative',i);}
  }
  G.detail=info||('Streak '+G.streak+' · '+G.deck.length+' cards remaining');
  if(cardsLeft()===0){endRun(false,'All board positions lost.');return}
  if(!G.deck.length){finishStage();return}
  G.phase='playing';refresh();
 };
 if(reduced)resolve();else setTimeout(resolve,250);
}
$('higher').onclick=()=>guess('higher');$('lower').onclick=()=>guess('lower');
$('restart').onclick=()=>showDialog('RESTART','Start a new run?','Your current Roguelike progress will be lost.',[],{label:'Restart',click:()=>{hideDialog();newRun()}});
$('push').onclick=()=>{if(G.phase!=='playing'||G.push)return;G.push=1;G.message=' Push Your Luck: win two guesses on this card for triple points';sound('push');flash('ability',G.selected,' PUSH YOUR LUCK');refresh()};
$('shield').onclick=()=>{if(!G.shields||G.phase!=='playing'||!G.board[G.selected]||G.protected[G.selected])return;G.shields--;G.protected[G.selected]=true;G.message=rank(G.board[G.selected])+' protected · one miss';sound('shield');flash('ability',G.selected,' PROTECTED');refresh()};
$('peek').onclick=()=>{if(!G.peeks||G.phase!=='playing')return;G.peeks--;const c=[...G.deck].reverse().find(x=>!x.joker);G.message=c?' Next regular card: '+rank(c):'No regular card left';sound('peek');flash('ability',G.selected,c?' NEXT: '+rank(c):'NO REGULAR CARD');refresh()};
$('swap').onclick=()=>{if(!G.swaps||G.phase!=='playing')return;swapFrom=G.selected;G.message='⇄ Select another occupied card to swap';sound('swap');flash('ability',G.selected,'⇄ SELECT SECOND CARD');refresh()};
$('cashout').onclick=()=>{if(G.phase!=='playing'||G.streak<3)return;G.streak=0;G.shields++;G.message=' Streak cashed out · +1 Shield';sound('cashout');flash('ability',G.selected,' STREAK CASHED OUT');refresh()};
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
function hitCard(e){pointer.x=e.clientX/innerWidth*2-1;pointer.y=1-e.clientY/innerHeight*2;ray.setFromCamera(pointer,camera);return ray.intersectObjects(cardMeshes.filter(Boolean))[0]?.object.userData.index??-1}
$('scene').addEventListener('pointermove',e=>{hovered=hitCard(e);$('scene').style.cursor=hovered>=0?'pointer':'default'});
$('scene').addEventListener('pointerleave',()=>{hovered=-1});

 if(G.phase!=='playing'||G.push===2)return;const i=hitCard(e);if(i<0)return;
 if(swapFrom!==null){if(i!==swapFrom){[G.board[i],G.board[swapFrom]]=[G.board[swapFrom],G.board[i]];[G.protected[i],G.protected[swapFrom]]=[G.protected[swapFrom],G.protected[i]];meshCard(G.board[i],i);meshCard(G.board[swapFrom],swapFrom);G.swaps--;G.message='⇄ Swapped two cards';sound('swap');flash('ability',i,'⇄ SWAPPED')}swapFrom=null}
 G.selected=i;refresh();sound('select');flash('ability',i);
});

$('runInfo').onclick=()=>showDialog('',BOSSES[G.stage-1].name,
 BOSSES[G.stage-1].desc+' Ace is low. Ties lose. Each Joker adds five cards.',[
 {title:'Run',desc:'Stage '+G.stage+'/3 · '+G.correct+' correct · Streak '+G.streak+' · '+cardsLeft()+'/9 slots'},
 {title:'Ticket',desc:TICKETS.find(t=>t.id===G.ticket)?.desc||'Choose a ticket to begin.'},

document.addEventListener('keydown',e=>{

let lastTime=0;
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min(.05,(now-lastTime)/1000||.016);lastTime=now;
 for(let i=animations.length-1;i>=0;i--){
  const a=animations[i];if(!a.m.parent){animations.splice(i,1);continue}
  const t=Math.min(1,(now-a.start)/a.duration),q=1-(1-t)**3;
  a.m.position.set(THREE.MathUtils.lerp(deckX,a.p.x,q),THREE.MathUtils.lerp(1.15,a.m.userData.targetY,q)+Math.sin(Math.PI*t)*.32,THREE.MathUtils.lerp(deckZ,a.p.z,q));
  a.m.rotation.x=Math.PI*(1-q);
  if(t>=1){animations.splice(i,1);sound('land')};
 }
 for(let i=discards.length-1;i>=0;i--){
  const d=discards[i],t=Math.min(1,(now-d.start)/d.duration),q=t*t*(3-2*t);
  d.m.position.set(THREE.MathUtils.lerp(d.from.x,discardX,q),d.from.y+Math.sin(Math.PI*t)*.36,THREE.MathUtils.lerp(d.from.z,discardZ,q));
  d.m.rotation.z=d.rotation+q*.5;d.m.rotation.x=q*.55;

 }
 for(const m of cardMeshes)if(m?.userData.selection)m.userData.selection.visible=m.userData.index===G?.selected&&(G?.phase==='playing'||G?.phase==='busy');
 for(const m of cardMeshes)if(m&&!animations.some(a=>a.m===m)){
  const chosen=m.userData.index===G?.selected&&G?.phase==='playing';

  m.userData.targetY=chosen?1.02:hover?.92:.75;
  m.position.y=reduced?.75:THREE.MathUtils.damp(m.position.y,m.userData.targetY,15,dt);

 }
 for(let i=0;i<9;i++){
  const fx=highlights[i],alive=fx&&now<fx.end,selected=G?.selected===i&&G?.phase==='playing';
  const pad=pads[i];

  pad.material.emissiveIntensity=alive?.8*(fx.end-now)/520:G?.locked[i]?.8:selected?.18:0;
 }
