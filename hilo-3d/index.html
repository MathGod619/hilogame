<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0806">
<title>HiLo — Midnight Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@700;900&family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:wght@900&family=Racing+Sans+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=8">
<link rel="stylesheet" href="stakes.css?v=3">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
</head>
<body data-boss="1">
<div id="bg" aria-hidden="true"><div class="lamp"></div><div class="glowA"></div><div class="glowB"></div></div>
<canvas id="scene" aria-label="Three-dimensional card table. Click a card to select it."></canvas>
<div id="vignette" aria-hidden="true"></div>

<header id="topbar">
  <div class="tbLeft">
    <div class="brand" aria-hidden="true">HI<span>·</span>LO</div>
    <div class="stat plaque" id="scoreStat"><small>Score</small><strong id="score">0</strong></div>
  </div>
  <button id="bossChip" class="plaque bossPlaque" aria-label="Boss and run details">
    <span class="screw"></span>
    <span id="bossEmblem" class="bossEmblem"></span>
    <span class="bossText"><b id="bossName">The Tollkeeper</b><small><span id="stageLabel">Stage 1 / 3</span><span class="pips"><i></i><i></i><i></i></span></small></span>
    <span class="screw"></span>
  </button>
  <div class="tbRight">
    <div class="stat plaque" id="tokensStat"><small>Tokens</small><strong><span data-icon="chip"></span><span id="tokens">65</span></strong><em id="debt"></em></div>
    <div class="stat plaque" id="deckStat"><small id="deckLabel">Deck</small><strong id="deck">54</strong><div class="bar"><i id="deckBar"></i></div></div>
    <nav class="menu">
      <a class="mbtn" href="../table-battle/" title="Table Battle (multiplayer)" aria-label="Table Battle multiplayer" data-icon="vs"></a>
      <button class="mbtn" id="runInfo" title="Rules and run details" aria-label="Rules and run details" data-icon="info"></button>
      <button class="mbtn" id="settings" title="Settings" aria-label="Settings" data-icon="gear"></button>
      <button class="mbtn" id="restart" title="Restart run" aria-label="Restart run" data-icon="restart"></button>
    </nav>
  </div>
</header>

<section id="panel" aria-label="Controls">
  <div id="loadout">
    <button id="ticketBadge" class="ticketBadge empty" aria-label="Your ticket"></button>
    <div id="artifacts" class="artifacts"></div>
    <div id="locks" class="locks" title="Collector locks used (max 3)"></div>
    <div id="mech" class="mech" hidden></div>
    <div class="boardCount" title="Cards on the board"><span data-icon="grid"></span><b id="boardCount">0/9</b></div>
  </div>
  <div id="coach" hidden aria-live="polite"><div class="coachTop"><b id="coachStep"></b><button id="coachSkip">Skip tutorial</button></div><p id="coachText"></p><button id="coachNext" class="btn primary">Next</button></div>
  <div id="callout"><div id="message" aria-live="polite"></div><div id="detail"></div></div>
  <div id="hsBar" hidden>
    <div class="hsTop"><b id="hsScore">0</b><span>of</span><b id="hsMin">0</b><em id="hsCalls"></em></div>
    <div class="hsTrack"><i id="hsFill"></i></div>
  </div>
  <div id="streakMeter" data-tier="0">
    <div class="smHead"><span data-icon="flame"></span><b id="streakLabel">Streak</b><span id="streak" class="smNum">0</span></div>
    <div class="segs"></div>
    <svg class="gauge" viewBox="0 0 200 136" aria-hidden="true">
      <path class="arc" d="M22.95 128.05A82 82 0 1 1 177.05 128.05" />
      <g id="gaugeTicks"></g>
      <g id="needle"><path d="M97 100L100 30 103 100z"/></g>
      <circle cx="100" cy="100" r="8"/>
    </svg>
  </div>
  <div class="guesses">
    <button id="higher" class="guess hi"><span data-icon="up"></span><span class="gl">Higher<small class="fc"></small></span><kbd>H</kbd></button>
    <button id="lower" class="guess lo"><span data-icon="down"></span><span class="gl">Lower<small class="fc"></small></span><kbd>L</kbd></button>
  </div>
  <div class="tools">
    <button id="push" class="tool" title="Push: win twice on this card for a Peek. Misses bypass protection." data-icon="push"><span class="tl">Push</span><b class="badge" hidden></b></button>
    <button id="shield" class="tool" data-icon="shield"><span class="tl">Shield</span><b class="badge"></b></button>
    <button id="peek" class="tool" title="Peek at the next regular card" data-icon="eye"><span class="tl">Peek</span><b class="badge"></b></button>
    <button id="swap" class="tool" title="Swap two cards on the board" data-icon="swap"><span class="tl">Swap</span><b class="badge"></b></button>
    <button id="cashout" class="tool" title="Cash out a 3+ streak for tokens" data-icon="coins"><span class="tl">Cash out</span><b class="badge" hidden></b></button>
  </div>
</section>

<div id="fxLayer" aria-hidden="true"></div>
<div id="banner" aria-live="polite"></div>
<aside id="lesson" hidden aria-live="polite">
  <div class="lHead"><small id="lessonStep"></small><span id="lessonDots"></span></div>
  <h3 id="lessonTitle"></h3><p id="lessonCopy"></p>
  <div class="lBtns"><button id="lessonNext" class="btn primary">Play</button><button id="lessonSkip" class="btn ghost">Skip tutorial</button></div>
</aside>
<div id="screen" class="screen hidden" role="dialog" aria-modal="true"></div>
<div id="loading"><div class="ldLogo">HI<span>·</span>LO</div><div class="ldBar"><i></i></div><small>Shuffling the midnight deck…</small></div>
<script type="module" src="game.js?v=11"></script>
</body></html>
