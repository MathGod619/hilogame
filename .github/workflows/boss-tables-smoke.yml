name: Hi-Lo desktop and phone beta checks
on:
  push:
    branches: ['qa/boss-tables-release']
permissions:
  contents: read
jobs:
  playthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/hilo-http.log 2>&1 &
          node beta-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boss-tables-layout
          path: '*-elevator.png'
          if-no-files-found: ignore
